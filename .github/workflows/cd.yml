name: ShopSphere CD


on:
  push:
    branches: [main]
  workflow_dispatch:
  
jobs:
  deploy:
    # Use a self-hosted runner in your VirtualBox lab because it can reach
    # the private deployment VM at 192.168.185.21.
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push frontend
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/shopsphere-frontend:${{ github.sha }} ./frontend
          docker push ghcr.io/${{ github.repository_owner }}/shopsphere-frontend:${{ github.sha }}

      - name: Build and push backend
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/shopsphere-backend:${{ github.sha }} ./backend
          docker push ghcr.io/${{ github.repository_owner }}/shopsphere-backend:${{ github.sha }}

      - name: Install Ansible collection
        run: ansible-galaxy collection install community.docker

      - name: Verify deployment host
        run: ansible production -i ansible/inventory/hosts -m ping

      - name: Deploy
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i ansible/inventory/hosts \
            -e "frontend_image=ghcr.io/${{ github.repository_owner }}/shopsphere-frontend:${{ github.sha }}" \
            -e "backend_image=ghcr.io/${{ github.repository_owner }}/shopsphere-backend:${{ github.sha }}" \
            ansible/playbooks/deploy.yml
