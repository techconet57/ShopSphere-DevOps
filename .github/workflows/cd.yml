
name: ShopSphere CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image owner
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        run: |
          docker build \
            -t ghcr.io/${IMAGE_OWNER}/shopsphere-frontend:${GITHUB_SHA} \
            ./frontend

          docker push \
            ghcr.io/${IMAGE_OWNER}/shopsphere-frontend:${GITHUB_SHA}

      - name: Build and push backend
        run: |
          docker build \
            -t ghcr.io/${IMAGE_OWNER}/shopsphere-backend:${GITHUB_SHA} \
            ./backend

          docker push \
            ghcr.io/${IMAGE_OWNER}/shopsphere-backend:${GITHUB_SHA}

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install community.docker

      - name: Create Ansible Vault password file
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          if [ -z "$VAULT_PASSWORD" ]; then
            echo "ANSIBLE_VAULT_PASSWORD secret is missing"
            exit 1
          fi

          printf '%s' "$VAULT_PASSWORD" > "$RUNNER_TEMP/vault_password"
          chmod 600 "$RUNNER_TEMP/vault_password"

      - name: Verify deployment host
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible production \
            -i ansible/inventory/hosts \
            --vault-password-file "$RUNNER_TEMP/vault_password" \
            -m ping

      - name: Deploy with Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i ansible/inventory/hosts \
            --vault-password-file "$RUNNER_TEMP/vault_password" \
            -e "frontend_image=ghcr.io/${{ github.repository_owner }}/shopsphere-frontend:${{ github.sha }}" \
            -e "backend_image=ghcr.io/${{ github.repository_owner }}/shopsphere-backend:${{ github.sha }}" \
            ansible/playbooks/deploy.yml