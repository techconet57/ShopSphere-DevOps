name: ShopSphere CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Build frontend image
        run: docker build -t shopsphere-frontend:ci ./frontend

      - name: Build backend image
        run: docker build -t shopsphere-backend:ci ./backend
